name: deploiy email api to azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: emailSenderAPI
  NODE_VERSION: "22.x"

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    eenvironment: 
      name: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sanity check (tsconfig)
        run: |
          test -f tsconfig.json || (echo "tsconfig.json no existe en la raíz" && exit 1)
          test -d src || (echo "Carpeta src/ no existe" && exit 1)

      - name: Build (ts -> dist)
        run: npm run build

      - name: Prune to production deps
        run: npm ci --omit=dev

      - name: Create deployment package
        run: |
          rm -f release.zip
          zip -r release.zip \
            dist \
            node_modules \
            package.json \
            package-lock.json \
            templates \
            -x "*.git*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.PUBLISH_PROFILE }} 
          package: release.zip